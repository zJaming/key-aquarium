[package]
name = "key-aquarium"
version = "0.1.1"
description = "Key Aquarium 透明桌面水族箱"
authors = ["KeyAquarium"]
license = "MIT"
repository = "https://github.com/zJaming/key-aquarium"
edition = "2021"

[lib]
name = "key_aquarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "block2"] }
